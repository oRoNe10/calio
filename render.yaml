services:
  - type: web
    name: calio-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      # Set these in the Render dashboard → Environment:
      - key: DATABASE_URL
        sync: false   # Neon / Render Postgres connection string
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false   # e.g. https://calio.vercel.app
